<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レスババトル ONLINE</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }

    /* 画面切り替え用のクラス */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    /* === 1. メニュー画面 === */
    .menu-title {
      font-size: 2rem;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      color: var(--accent-red);
      font-weight: bold;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    .status-card {
      background: var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 10px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent-red);
      color: white;
    }

    .btn-secondary {
      background-color: var(--border-color);
      color: var(--text-main);
    }

    /* === 2. 待機画面 === */
    .matching-box {
      margin: auto;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid var(--border-color);
      border-top: 5px solid var(--accent-red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* === 3. バトル画面 === */
    .battle-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .theme-box {
      background-color: var(--bg-color);
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .timer-display {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-red);
      margin-bottom: 10px;
    }

    .hp-bars {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .hp-box {
      flex: 1;
    }

    .hp-label {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .hp-bar-outer {
      width: 100%;
      height: 12px;
      background-color: var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .hp-left { background-color: var(--accent-blue); }
    .hp-right { background-color: var(--accent-red); }

    .chat-timeline {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      word-break: break-all;
    }

    .msg-self {
      align-self: flex-end;
      background-color: #1e3a8a;
      color: white;
    }

    .msg-opponent {
      align-self: flex-start;
      background-color: var(--border-color);
      color: white;
    }

    .msg-sender {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .typing-indicator {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-style: italic;
      height: 18px;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      outline: none;
    }

    .btn-send {
      width: 80px;
      background-color: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* === 4. モーダル / ランキング === */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 85%;
      max-width: 400px;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .modal-body {
      color: var(--text-sub);
      margin-bottom: 20px;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .ranking-list {
      text-align: left;
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. メニュー画面 -->
    <div id="menu-screen" class="screen active">
      <h1 class="menu-title">レスババトル ONLINE</h1>

      <div class="status-card">
        <div>
          <div style="font-size: 0.8rem; color: var(--text-sub);">プレイヤー情報</div>
          <div id="user-display-level" style="font-size: 1.2rem; font-weight: bold;">Lv.1</div>
        </div>
        <div>
          <span style="font-size: 0.8rem; color: var(--text-sub);">通算勝利数: </span>
          <span id="user-display-wins" style="font-weight: bold; color: var(--accent-green);">0 勝</span>
        </div>
      </div>

      <div class="input-group">
        <label for="username-input">プレイヤー名</label>
        <input type="text" id="username-input" placeholder="名前を入力（初期: 名無し）" maxlength="10">
      </div>

      <button id="btn-match" class="btn btn-primary">対戦を開始する</button>
      <button id="btn-ranking" class="btn btn-secondary">ランキング</button>
    </div>

    <!-- 2. マッチング待機画面 -->
    <div id="matching-screen" class="screen">
      <div class="matching-box">
        <div class="spinner"></div>
        <h2>対戦相手を探しています...</h2>
        <p style="color: var(--text-sub); margin-top: 10px;">しばらくお待ちください</p>
      </div>
    </div>

    <!-- 3. バトル画面 -->
    <div id="battle-screen" class="screen">
      <div class="battle-header">
        <div id="theme-display" class="theme-box">お題: 読み込み中...</div>
        <div id="timer-display" class="timer-display">残り時間 03:00</div>

        <div class="hp-bars">
          <div class="hp-box">
            <div class="hp-label">
              <span id="p1-name">あなた</span>
              <span id="p1-hp-text">10000</span>
            </div>
            <div class="hp-bar-outer">
              <div id="p1-hp-bar" class="hp-bar-inner hp-left"></div>
            </div>
          </div>
          <div class="hp-box">
            <div class="hp-label">
              <span id="p2-name">相手</span>
              <span id="p2-hp-text">10000</span>
            </div>
            <div class="hp-bar-outer">
              <div id="p2-hp-bar" class="hp-bar-inner hp-right"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="chat-timeline" class="chat-timeline"></div>

      <div id="typing-indicator" class="typing-indicator"></div>

      <div class="input-area">
        <input type="text" id="chat-input" placeholder="反論を入力（Enterで送信）..." autocomplete="off">
        <button id="btn-send" class="btn-send">送信</button>
        <button id="btn-surrender" class="btn" style="width: auto; background: var(--border-color); padding: 0 10px; font-size: 0.8rem;">降参</button>
      </div>
    </div>

    <!-- 共通モーダル（通知 / 結果表示用） -->
    <div id="notice-modal" class="modal-overlay">
      <div class="modal-card">
        <h3 id="modal-title" class="modal-title">通知</h3>
        <p id="modal-body" class="modal-body">メッセージ内容</p>
        <button id="modal-close-btn" class="btn btn-primary">OK</button>
      </div>
    </div>

    <!-- ランキング用モーダル -->
    <div id="ranking-modal" class="modal-overlay">
      <div class="modal-card">
        <h3 class="modal-title">🏆 通算勝利ランキング</h3>
        <div id="ranking-list" class="ranking-list"></div>
        <button id="ranking-close-btn" class="btn btn-secondary">閉じる</button>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --------------------------------------------------
    // 1. ユーザー固有IDの獲得・管理（端末ストレージ利用）
    // --------------------------------------------------
    function getOrCreateUserId() {
      let userId = localStorage.getItem('my_game_user_id');
      if (!userId) {
        userId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem('my_game_user_id', userId);
      }
      return userId;
    }

    const userId = getOrCreateUserId();
    const socket = io();

    let currentRoomId = null;
    let isTypingTimer = null;

    // 接続時にサーバーへ自身のIDを認識させる
    socket.on('connect', () => {
      socket.emit('auth_user', { userId: userId });
    });

    // サーバーから読み込まれたユーザーデータを受信
    socket.on('user_data_loaded', (userData) => {
      document.getElementById('user-display-level').innerText = `Lv.${userData.level}`;
      document.getElementById('user-display-wins').innerText = `${userData.wins} 勝`;
      if (userData.name && userData.name !== "名無し") {
        document.getElementById('username-input').value = userData.name;
      }
    });

    // --------------------------------------------------
    // 2. 画面切り替え & モーダルヘルパー
    // --------------------------------------------------
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showNoticeModal(title, body) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = body;
      document.getElementById('notice-modal').style.display = 'flex';
    }

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      document.getElementById('notice-modal').style.display = 'none';
    });

    document.getElementById('ranking-close-btn').addEventListener('click', () => {
      document.getElementById('ranking-modal').style.display = 'none';
    });

    // --------------------------------------------------
    // 3. メニュー画面の処理
    // --------------------------------------------------
    const usernameInput = document.getElementById('username-input');

    // 名前入力変更時にリアルタイムで保存依頼
    usernameInput.addEventListener('change', () => {
      const newName = usernameInput.value.trim() || "名無し";
      socket.emit('update_name', { name: newName });
    });

    document.getElementById('btn-match').addEventListener('click', () => {
      const name = usernameInput.value.trim() || "名無し";
      showScreen('matching-screen');
      socket.emit('join_match', { name: name });
    });

    document.getElementById('btn-ranking').addEventListener('click', () => {
      socket.emit('get_ranking');
    });

    socket.on('ranking_data', (rankingList) => {
      const container = document.getElementById('ranking-list');
      container.innerHTML = '';

      if (rankingList.length === 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-sub);">まだ記録がありません</div>';
      } else {
        rankingList.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'ranking-item';
          div.innerHTML = `
            <span><strong>#${index + 1}</strong> ${escapeHtml(item.name)} (Lv.${item.level})</span>
            <span style="color: var(--accent-green); font-weight: bold;">${item.wins} 勝</span>
          `;
          container.appendChild(div);
        });
      }

      document.getElementById('ranking-modal').style.display = 'flex';
    });

    // --------------------------------------------------
    // 4. バトル画面の処理
    // --------------------------------------------------
    socket.on('match_found', (data) => {
      currentRoomId = data.roomId;
      document.getElementById('theme-display').innerText = `お題: ${data.theme}`;
      document.getElementById('chat-timeline').innerHTML = '';
      showScreen('battle-screen');
    });

    // 毎秒のタイマー・HP同期処理
    socket.on('tick_status', (data) => {
      // 時間表示
      const m = Math.floor(data.timeLeft / 60).toString().padStart(2, '0');
      const s = (data.timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `残り時間 ${m}:${s}`;

      // HP表示の更新
      const pIds = Object.keys(data.players);
      if (pIds.length === 2) {
        const isMeP1 = pIds[0] === socket.id;
        const myData = data.players[socket.id];
        const oppId = pIds.find(id => id !== socket.id);
        const oppData = data.players[oppId];

        if (myData && oppData) {
          document.getElementById('p1-name').innerText = `${myData.name} (あなた)`;
          document.getElementById('p1-hp-text').innerText = myData.hp;
          document.getElementById('p1-hp-bar').style.width = `${(myData.hp / 10000) * 100}%`;

          document.getElementById('p2-name').innerText = oppData.name;
          document.getElementById('p2-hp-text').innerText = oppData.hp;
          document.getElementById('p2-hp-bar').style.width = `${(oppData.hp / 10000) * 100}%`;

          // 相手が入力中かどうかのインジケーター表示
          const typingElem = document.getElementById('typing-indicator');
          if (oppData.isTyping) {
            typingElem.innerText = `${oppData.name} が入力中...`;
          } else {
            typingElem.innerText = '';
          }
        }
      }
    });

    // メッセージ送信処理
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');

    function sendMessage() {
      const msg = chatInput.value.trim();
      if (!msg || !currentRoomId) return;

      socket.emit('send_message', { roomId: currentRoomId, message: msg });
      chatInput.value = '';
      sendTypingStatus(false);
    }

    btnSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // タイピング検知
    chatInput.addEventListener('input', () => {
      sendTypingStatus(true);
      clearTimeout(isTypingTimer);
      isTypingTimer = setTimeout(() => {
        sendTypingStatus(false);
      }, 1500);
    });

    function sendTypingStatus(isTyping) {
      if (currentRoomId) {
        socket.emit('typing_status', { roomId: currentRoomId, isTyping: isTyping });
      }
    }

    // チャット受信処理
    socket.on('receive_message', (data) => {
      const timeline = document.getElementById('chat-timeline');
      const isSelf = data.senderId === socket.id;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = `msg-bubble ${isSelf ? 'msg-self' : 'msg-opponent'}`;

      const senderDiv = document.createElement('div');
      senderDiv.className = 'msg-sender';
      senderDiv.innerText = `${data.senderName} (${data.senderSide})`;

      const textDiv = document.createElement('div');
      textDiv.innerText = data.message;

      bubbleDiv.appendChild(senderDiv);
      bubbleDiv.appendChild(textDiv);
      timeline.appendChild(bubbleDiv);

      timeline.scrollTop = timeline.scrollHeight;
    });

    // 降参ボタン
    document.getElementById('btn-surrender').addEventListener('click', () => {
      if (currentRoomId && confirm("本当に降参しますか？")) {
        socket.emit('surrender', { roomId: currentRoomId });
      }
    });

    // --------------------------------------------------
    // 5. ゲーム終了・通知イベント
    // --------------------------------------------------
    socket.on('game_over', (data) => {
      showScreen('menu-screen');

      let title = "試合終了";
      let message = "";

      if (data.reason === "OPPONENT_KICKED") {
        title = "🎉 不戦勝！";
        message = "相手プレイヤーが暴言（NGワード）によりキックされたため、あなたの勝利です！";
      } else if (data.reason === "DISCONNECTED") {
        title = "🎉 不戦勝！";
        message = "相手プレイヤーが通信切断（タブを閉じた等）したため、あなたの勝利です！";
      } else if (data.reason === "SURRENDER") {
        title = "試合決着";
        message = `勝者: ${data.winnerName}\n（降参により決着）`;
      } else {
        title = data.winnerName === "DRAW" ? "引き分け！" : `🎉 勝者: ${data.winnerName}`;
        message = data.reason === "HP_ZERO" ? "HPが0になりました！" : "制限時間が終了しました！";
      }

      showNoticeModal(title, message);

      // 戦績更新のため、最新のユーザー情報を再取得するリクエストを送信
      socket.emit('auth_user', { userId: userId });
    });

    socket.on('kicked_notification', (data) => {
      showScreen('menu-screen');
      showNoticeModal("ペナルティ通知", data.reason);
    });

    // XSS防止用エスケープ関数
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
