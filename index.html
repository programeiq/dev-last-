<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆるろん</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      background-color: #31A87B;
      color: #333333;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .screen {
      display: none !important;
    }
    .screen.active {
      display: flex !important;
    }

    /* メニュー画面 */
    #menu-screen {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 550px;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    #user-profile-area {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid #7AD6B8;
      color: #7AD6B8;
    }

    #user-icon-slot {
      width: 60px;
      height: 60px;
      background-color: #FFFFFF;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.1s;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #user-icon-slot:hover { transform: scale(1.05); }
    #custom-icon-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #fallback-text { font-size: 11px; font-weight: bold; color: #31A07B; text-align: center; line-height: 1.2; }
    #icon-file-input { display: none; }

    #user-info-text { display: flex; flex-direction: column; }
    #game-title { font-size: 22px; font-weight: bold; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); color: #FFFFFF; }
    #user-badge { font-size: 13px; font-weight: bold; opacity: 0.9; color: #FFFFFF; }
    #icon-item-label { font-size: 11px; background: #FFFFFF; color: #31A07B; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-top: 4px; width: fit-content; cursor: pointer; }

    .right-menu-container { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }

    .side-btn {
      width: 70px; height: 70px; border-radius: 50%; border: 3px solid #FFFFFF; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.1s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.15); outline: none; display: flex; align-items: center; justify-content: center;
    }
    .side-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.2); }
    .btn-settings { background-color: #7ad6b8; color: white; }
    .btn-ranking { background-color: #7ad6b8; color: #333333; border-color: #333333; }
    .btn-rule { background-color: #7ad6b8; color: white; }

    #vs-logo-container { flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 40px; }
    .vs-bubble { position: relative; width: 180px; height: 180px; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: 900; color: #1f654e; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

    #display-box { background: rgba(255, 255, 255, 0.9); border: 2px solid #FFFFFF; border-radius: 15px; padding: 15px 30px; font-size: 18px; font-weight: bold; text-align: center; white-space: pre-wrap; box-shadow: 0 6px 15px rgba(0,0,0,0.1); width: 60%; margin-bottom: 20px; }

    .bottom-btn-container { width: 80%; max-width: 600px; margin-bottom: 10px; }
    .btn-play { width: 100%; background-color: #FFFFFF; color: #00A2FF; border: 4px solid #FFFFFF; padding: 18px 0; font-size: 26px; font-weight: bold; cursor: pointer; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); transition: all 0.2s ease; }
    .btn-play:hover { background-color: #F0F8FF; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #FFFFFF;
      border-radius: 20px;
      width: 85%;
      max-width: 500px;
      max-height: 80vh;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .modal-header {
      font-size: 22px; font-weight: bold; color: #31A07B; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #31A07B; padding-bottom: 8px;
    }
    .modal-body {
      overflow-y: auto; flex-grow: 1; font-size: 15px; line-height: 1.6; color: #444; white-space: pre-wrap;
    }
    .modal-close-btn {
      margin-top: 15px; background: #FF7675; color: white; border: none; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center;
    }
  </style>
</head>
<body>

  <!-- メニュー画面 -->
  <div id="menu-screen" class="screen active">
    <div id="user-profile-area">
      <div id="user-icon-slot" onclick="playButtonSound(); triggerImageUpload()" title="クリックして写真をアップロード！">
        <img id="custom-icon-img" style="display:none;" alt="ユーザーアイコン">
        <span id="fallback-text">写真<br>UP</span>
      </div>
      <input type="file" id="icon-file-input" accept="image/*" onchange="handleImageUpload(event)">

      <div id="user-info-text">
        <h1 id="game-title">ゆるろん</h1>
        <div id="user-badge">プレイヤー: <span id="player-name-disp">名無し</span></div>
        <div id="icon-item-label" onclick="playButtonSound(); openItemBox()" title="称号アイテムを変更する">初心者</div>
      </div>
    </div>

    <div class="right-menu-container">
      <button class="side-btn btn-settings" onclick="playButtonSound(); changeName()" title="名前を変更する">SET</button>
      <button class="side-btn btn-ranking" onclick="playButtonSound(); openNoticeModal('ランキング', 'オフラインモードです')">RANK</button>
      <button class="side-btn btn-rule" onclick="playButtonSound(); openRuleModal()">RULE</button>
    </div>

    <div id="vs-logo-container">
      <div class="vs-bubble">VS</div>
    </div>
    
    <div id="display-box">STATUS : READY</div>

    <div class="bottom-btn-container">
      <button class="btn-play" onclick="playButtonSound(); openNoticeModal('スタート', 'フロントエンド単体動作モードです')">PLAY</button>
    </div>
  </div>

  <!-- ポップアップモーダル -->
  <div id="notice-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="notice-modal-header" class="modal-header">お知らせ</div>
      <div id="notice-modal-body" class="modal-body">---</div>
      <button class="modal-close-btn" onclick="playButtonSound(); closeModal('notice-modal')">閉じる</button>
    </div>
  </div>

  <div id="rule-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">ゆるろんルール解説</div>
      <div class="modal-body">
【基本ルール】
1. 出されたお題でディベート！
2. 双方HP「10000」からスタート。
3. 1秒ごとにHPが1ずつ自然減少。
      </div>
      <button class="modal-close-btn" onclick="playButtonSound(); closeModal('rule-modal')">閉じる</button>
    </div>
  </div>

  <script>
    // --- 効果音機能 (Web Audio API) ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playButtonSound() {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }
    window.addEventListener('click', initAudio, { once: true });

    // --- ローカルストレージ（ブラウザ保存）処理 ---
    window.addEventListener('DOMContentLoaded', () => {
      // 1. 保存された名前の復元
      const savedName = localStorage.getItem('yururon_user_name');
      if (savedName) {
        document.getElementById('player-name-disp').innerText = savedName;
      }

      // 2. 保存されたアイコン画像の復元
      const savedIcon = localStorage.getItem('yururon_user_icon');
      if (savedIcon) {
        showIconImage(savedIcon);
      }
    });

    // 画像選択時の処理
    function triggerImageUpload() {
      document.getElementById('icon-file-input').click();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      // localStorageの容量制限（約5MB）対策のため1MB以下に制限
      if (file.size > 1024 * 1024) {
        openNoticeModal("エラー", "画像サイズが大きすぎます（1MB以下の画像を選んでください）");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Image = evt.target.result;

        // 1. 画面表示の更新
        showIconImage(base64Image);

        // 2. localStorage に保存（これが肝！）
        localStorage.setItem('yururon_user_icon', base64Image);
      };
      reader.readAsDataURL(file);
    }

    function showIconImage(src) {
      const img = document.getElementById('custom-icon-img');
      img.src = src;
      img.style.display = 'block';
      document.getElementById('fallback-text').style.display = 'none';
    }

    function changeName() {
      const currentName = document.getElementById('player-name-disp').innerText;
      const newName = prompt("新しい名前を入力してください:", currentName);
      if (newName && newName.trim() !== "") {
        const trimmed = newName.trim();
        document.getElementById('player-name-disp').innerText = trimmed;
        localStorage.setItem('yururon_user_name', trimmed);
      }
    }

    // モーダル操作
    function openNoticeModal(title, bodyText) {
      document.getElementById('notice-modal-header').innerText = title;
      document.getElementById('notice-modal-body').innerText = bodyText;
      document.getElementById('notice-modal').style.display = 'flex';
    }
    function openRuleModal() {
      document.getElementById('rule-modal').style.display = 'flex';
    }
    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
    function openItemBox() {
      openNoticeModal("称号変更", "現在の称号: 初心者");
    }
  </script>
</body>
</html>
