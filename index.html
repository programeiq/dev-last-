<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ディベートゲーム</title>
  <style>
    body {
      background-color: #31A87B;
      color: #333333;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    #menu-screen {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 550px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 20px;
    }

    #user-profile-area {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid #7AD6B8;
      color: #7AD6B8;
    }

    #user-icon-slot {
      width: 60px;
      height: 60px;
      background-color: #FFFFFF;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.1s;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #user-icon-slot:hover { transform: scale(1.05); }
    #custom-icon-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #fallback-text { font-size: 11px; font-weight: bold; color: #31A07B; text-align: center; line-height: 1.2; }
    #icon-file-input { display: none; }

    #user-info-text { display: flex; flex-direction: column; }
    #game-title { font-size: 22px; font-weight: bold; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
    #user-badge { font-size: 13px; font-weight: bold; opacity: 0.9; }
    #icon-item-label { font-size: 11px; background: #FFFFFF; color: #31A07B; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-top: 4px; width: fit-content; cursor: pointer; }

    .right-menu-container { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }

    .side-btn {
      width: 70px; height: 70px; border-radius: 50%; border: 3px solid #FFFFFF; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.1s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.15); outline: none; display: flex; align-items: center; justify-content: center;
    }
    .side-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.2); }
    .btn-settings { background-color: #7ad6b8; color: white; }
    .btn-ranking { background-color: #7ad6b8; color: #333333; border-color: #333333; }
    .btn-rule { background-color: #7ad6b8; color: white; }

    #vs-logo-container { flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 40px; }
    .vs-bubble { position: relative; width: 180px; height: 180px; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: 900; color: #1f654e; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

    #display-box { background: rgba(255, 255, 255, 0.9); border: 2px solid #FFFFFF; border-radius: 15px; padding: 15px 30px; font-size: 18px; font-weight: bold; text-align: center; white-space: pre-wrap; box-shadow: 0 6px 15px rgba(0,0,0,0.1); width: 60%; margin-bottom: 20px; }

    .bottom-btn-container { width: 80%; max-width: 600px; margin-bottom: 10px; }
    .btn-play { width: 100%; background-color: #FFFFFF; color: #00A2FF; border: 4px solid #FFFFFF; padding: 18px 0; font-size: 26px; font-weight: bold; cursor: pointer; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); transition: all 0.2s ease; }
    .btn-play:hover { background-color: #F0F8FF; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    /* モーダル画面 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #FFFFFF;
      border-radius: 20px;
      width: 85%;
      max-width: 500px;
      max-height: 80vh;
      padding: 25px;
      box-sizing: border-box;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .modal-header {
      font-size: 22px; font-weight: bold; color: #31A07B; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #31A07B; padding-bottom: 8px;
    }
    .modal-body {
      overflow-y: auto; flex-grow: 1; font-size: 15px; line-height: 1.6; color: #444; white-space: pre-wrap;
    }
    .modal-close-btn {
      margin-top: 15px; background: #FF7675; color: white; border: none; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center;
    }
    .modal-action-btn {
      margin-top: 10px; background: #31A07B; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center;
    }

    /* フォーム要素 */
    .report-select, .report-textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 2px solid #31A07B;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .report-textarea {
      height: 80px;
      resize: none;
    }

    /* VSマッチング画面 */
    #vs-match-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: #31A87B; }
    .vs-match-box { background-color: #A0A0A0; border: 6px solid #FFFFFF; border-radius: 20px; width: 90%; max-width: 800px; padding: 40px 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 15px 30px rgba(0,0,0,0.3); position: relative; box-sizing: border-box; }
    #match-countdown-banner { position: absolute; top: -60px; background-color: #FF7675; color: white; padding: 10px 30px; border-radius: 30px; font-size: 22px; font-weight: bold; border: 3px solid #FFFFFF; box-shadow: 0 5px 15px rgba(0,0,0,0.2); white-space: nowrap; }
    .match-player-slot { display: flex; flex-direction: column; align-items: center; width: 40%; }
    .match-icon-container { width: 200px; height: 200px; background-color: #8B5A2B; border: 4px solid #FFFFFF; box-shadow: 0 8px 16px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 20px; }
    .match-icon-container img { width: 100%; height: 100%; object-fit: cover; }
    .match-icon-fallback { color: #FFFFFF; font-size: 18px; font-weight: bold; text-align: center; }
    .match-info-bar { width: 100%; background-color: #3A3A3A; color: #FFFFFF; text-align: center; padding: 12px 5px; font-size: 16px; font-weight: bold; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .match-center-vs { font-size: 60px; font-weight: 900; color: #FFF385; text-shadow: 4px 4px 0px #333; font-style: italic; }

    /* バトル画面 */
    #debate-screen { display: none; flex-direction: column; align-items: center; width: 95%; max-width: 700px; height: 85vh; border: 4px solid #FFFFFF; border-radius: 25px; background-color: #0d2b21; padding: 20px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); box-sizing: border-box; }
    #theme-info { width: 100%; background-color: #FF7675; border: 3px solid #FFFFFF; border-radius: 15px; padding: 12px; text-align: center; color: white; font-weight: bold; margin-bottom: 10px; box-sizing: border-box; }
    #timer-panel { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
    .time-sub-box { flex: 1; text-align: center; font-size: 14px; font-weight: bold; padding: 8px; border-radius: 10px; border: 2px solid #FFFFFF; transition: background-color 0.2s; }
    #game-timer-box { background-color: #FFEAA7; color: #333333; }
    #response-timer-box { background-color: #1DD1A1; color: white; }

    #hp-container { width: 100%; background-color: rgba(0,0,0,0.2); border: 2px solid #FFFFFF; border-radius: 15px; padding: 12px; margin-bottom: 15px; box-sizing: border-box; color: white; font-size: 14px; font-weight: bold; }
    .hp-bar-bg { 
        width: 100%; 
        background-color: #FFF; 
        height: 18px;
        border-radius: 9px; 
        overflow: hidden; 
        margin-top: 5px; 
    }
    .hp-bar-fill { height: 100%; background-color: #1DD1A1; width: 100%; transition: width 0.3s ease; }

    #chat-box { width: 100%; flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; background: rgba(255,255,255,0.9); border-radius: 20px; }
    .message-row { display: flex; flex-direction: column; width: 100%; margin: 6px 0; }
    .my-message { align-items: flex-end; }
    .other-message { align-items: flex-start; }
    .sender-name { font-size: 12px; color: #333333; font-weight: bold; margin-bottom: 2px; }

    .bubble { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 16px; font-weight: bold; line-height: 1.4; word-wrap: break-word; }
    .my-message .bubble { background-color: #1DD1A1; color: white; border-radius: 18px 18px 0px 18px; }
    .other-message .bubble { background-color: #DFE4EA; color: #333333; border-radius: 18px 18px 18px 0px; }
    
    .chat-input-container { display: flex; width: 100%; gap: 10px; }
    #message-input { flex-grow: 1; padding: 15px; font-size: 16px; border: 3px solid #FFFFFF; border-radius: 15px; outline: none; }
    #send-btn { padding: 15px 30px; font-size: 16px; background-color: #FFD166; color: #333333; border: 3px solid #FFFFFF; border-radius: 15px; cursor: pointer; font-weight: bold; }
    .btn-back { padding: 8px 18px; font-size: 14px; background-color: #FF7675; border-radius: 20px; border: 2px solid #FFFFFF; color: white; font-weight: bold; cursor: pointer;}
    .btn-report { padding: 8px 18px; font-size: 14px; background-color: #FD9644; border-radius: 20px; border: 2px solid #FFFFFF; color: white; font-weight: bold; cursor: pointer;}

    /* BGMコントロール用（画面右下に目立たないよう配置） */
    .bgm-control {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- メインメニュー画面 -->
  <div id="menu-screen">
    <div id="user-profile-area">
      <div id="user-icon-slot">
        <span id="fallback-text">ICON</span>
      </div>
      <div id="user-info-text">
        <h1 id="game-title">ディベートバトル</h1>
        <span id="user-badge">RANK: CLASSIC</span>
      </div>
    </div>

    <div class="right-menu-container">
      <button class="side-btn btn-settings">設定</button>
      <button class="side-btn btn-ranking">順位</button>
      <button class="side-btn btn-rule">ルール</button>
    </div>

    <div id="vs-logo-container">
      <div class="vs-bubble">VS</div>
    </div>

    <div id="display-box">オンライン対戦を始めよう！</div>

    <div class="bottom-btn-container">
      <button class="btn-play">対戦スタート</button>
    </div>
  </div>

  <!-- 🎵 BGMプレイヤー -->
  <audio id="bgm" src="New_Breath.mp3" loop></audio>

  <!-- BGM音量バー -->
  <div class="bgm-control">
    <span>🎵 BGM</span>
    <input type="range" id="bgmVolume" min="0" max="1" step="0.05" value="0.3" onchange="document.getElementById('bgm').volume = this.value">
  </div>

  <script>
    // ブラウザの自動再生ブロック対策（1回画面のどこかをクリックしたらBGM開始）
    const bgm = document.getElementById('bgm');
    document.addEventListener('click', () => {
      if (bgm.paused) {
        bgm.volume = 0.3; // 初期音量30%
        bgm.play().catch(e => console.log("自動再生が制限されました:", e));
      }
    }, { once: true });
  </script>

</body>
</html>
