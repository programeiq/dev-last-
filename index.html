<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レスバONLINE</title>
  <style>
    /* 全体設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      overflow: hidden;
    }

    /* 画面切り替え */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    /* タイトル画面 */
    .title-area {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }

    .title-area h1 {
      font-size: 2.4rem;
      color: #ff4757;
      font-weight: 800;
    }

    .profile-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-card input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border: 2px solid #ced4da;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .profile-card input:focus {
      border-color: #ff4757;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 12px;
      font-weight: bold;
      color: #495057;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      margin-bottom: 30px;
    }

    .btn {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-main {
      background-color: #ff4757;
      color: white;
    }

    .btn-sub {
      background-color: #e9ecef;
      color: #495057;
    }

    .btn-danger {
      background-color: #ff6b81;
      color: white;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    /* マッチング画面 */
    .matching-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff4757;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* バトル画面 */
    .battle-header {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #e9ecef;
    }

    .timer {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 4px;
    }

    .theme {
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #2f3542;
    }

    .status-bars {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-status {
      flex: 1;
      background: #f1f2f6;
      padding: 8px;
      border-radius: 8px;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #dfe4ea;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }

    .bar-fill {
      height: 100%;
      background: #2ed573;
      width: 100%;
      transition: width 0.3s;
    }

    .chat-area {
      flex: 1;
      background: #f1f2f6;
      border-radius: 10px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-all;
    }

    .bubble-mine {
      align-self: flex-end;
      background-color: #ff4757;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble-other {
      align-self: flex-start;
      background-color: #ffffff;
      color: #2f3542;
      border: 1px solid #e4e7eb;
      border-bottom-left-radius: 2px;
    }

    .sender-name {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-bottom: 2px;
    }

    .typing-text {
      font-size: 0.8rem;
      color: #747d8c;
      height: 16px;
      margin-bottom: 4px;
    }

    .input-box {
      display: flex;
      gap: 6px;
    }

    .input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      outline: none;
    }

    /* モーダル */
    .modal-bg {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-body {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      text-align: center;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 10px;
    }

    .ranking-container {
      max-height: 180px;
      overflow-y: auto;
      text-align: left;
      margin-bottom: 15px;
    }

    .rank-row {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- メニュー画面 -->
  <div id="menu-screen" class="screen active">
    <div class="title-area">
      <h1>レスバ ONLINE</h1>
    </div>

    <div class="profile-card">
      <div>プレイヤー設定</div>
      <input type="text" id="username-input" maxlength="10" placeholder="名前を入力">
      <div class="stats">
        <span id="user-display-level">Lv.1</span>
        <span id="user-display-wins">0 勝</span>
      </div>
    </div>

    <div class="menu-buttons">
      <button id="btn-match" class="btn btn-main">対戦をはじめる</button>
      <button id="btn-ranking" class="btn btn-sub">ランキング</button>
    </div>
  </div>

  <!-- マッチング画面 -->
  <div id="matching-screen" class="screen">
    <div class="matching-box">
      <div class="loader"></div>
      <p>対戦相手を探しています...</p>
    </div>
  </div>

  <!-- バトル画面 -->
  <div id="battle-screen" class="screen">
    <div class="battle-header">
      <div id="timer-display" class="timer">残り時間 03:00</div>
      <div id="theme-display" class="theme">お題を取得中...</div>
    </div>

    <div class="status-bars">
      <div class="player-status">
        <div id="p1-name" style="font-size: 0.8rem;">あなた</div>
        <div style="font-size: 0.75rem;">HP: <span id="p1-hp-text">10000</span></div>
        <div class="bar-bg"><div id="p1-hp-bar" class="bar-fill"></div></div>
      </div>
      <div class="player-status">
        <div id="p2-name" style="font-size: 0.8rem;">相手</div>
        <div style="font-size: 0.75rem;">HP: <span id="p2-hp-text">10000</span></div>
        <div class="bar-bg"><div id="p2-hp-bar" class="bar-fill"></div></div>
      </div>
    </div>

    <div id="chat-timeline" class="chat-area"></div>
    <div id="typing-indicator" class="typing-text"></div>

    <div class="input-box">
      <input type="text" id="chat-input" placeholder="反論を入力..." maxlength="100">
      <button id="btn-send" class="btn btn-main" style="padding: 10px 14px;">送信</button>
      <button id="btn-surrender" class="btn btn-danger">降参</button>
    </div>
  </div>

  <!-- モーダル (通知用) -->
  <div id="notice-modal" class="modal-bg">
    <div class="modal-body">
      <div id="modal-title" class="modal-title">通知</div>
      <div id="modal-text" style="margin-bottom: 15px; white-space: pre-wrap;"></div>
      <button id="modal-close-btn" class="btn btn-main" style="width: 100%;">閉じる</button>
    </div>
  </div>

  <!-- モーダル (ランキング用) -->
  <div id="ranking-modal" class="modal-bg">
    <div class="modal-body">
      <div class="modal-title">🏆 ランキング</div>
      <div id="ranking-list" class="ranking-container"></div>
      <button id="ranking-close-btn" class="btn btn-sub" style="width: 100%;">閉じる</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  function getOrCreateUserId() {
    let userId = localStorage.getItem('yururon_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem('yururon_user_id', userId);
    }
    return userId;
  }

  const userId = getOrCreateUserId();
  const socket = io();

  let currentRoomId = null;
  let isTypingTimer = null;

  socket.on('connect', () => {
    socket.emit('auth_user', { userId: userId });
  });

  socket.on('user_data_loaded', (userData) => {
    const levelElem = document.getElementById('user-display-level');
    const winsElem = document.getElementById('user-display-wins');
    const nameInput = document.getElementById('username-input');

    if (levelElem) levelElem.innerText = `Lv.${userData.level}`;
    if (winsElem) winsElem.innerText = `${userData.wins} 勝`;
    if (nameInput && userData.name && userData.name !== "名無し") {
      nameInput.value = userData.name;
    }
  });

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
  }

  function showNoticeModal(title, text) {
    const titleElem = document.getElementById('modal-title');
    const textElem = document.getElementById('modal-text');
    const modalElem = document.getElementById('notice-modal');

    if (titleElem) titleElem.innerText = title;
    if (textElem) textElem.innerText = text;
    if (modalElem) modalElem.style.display = 'flex';
  }

  const closeBtn = document.getElementById('modal-close-btn');
  if (closeBtn) {
    closeBtn.onclick = () => {
      document.getElementById('notice-modal').style.display = 'none';
    };
  }

  const rankCloseBtn = document.getElementById('ranking-close-btn');
  if (rankCloseBtn) {
    rankCloseBtn.onclick = () => {
      document.getElementById('ranking-modal').style.display = 'none';
    };
  }

  const usernameInput = document.getElementById('username-input');
  if (usernameInput) {
    usernameInput.addEventListener('change', () => {
      socket.emit('update_name', { name: usernameInput.value.trim() || "名無し" });
    });
  }

  const btnMatch = document.getElementById('btn-match');
  if (btnMatch) {
    btnMatch.onclick = () => {
      const name = usernameInput ? usernameInput.value.trim() || "名無し" : "名無し";
      showScreen('matching-screen');
      socket.emit('join_match', { name: name });
    };
  }

  const btnRanking = document.getElementById('btn-ranking');
  if (btnRanking) {
    btnRanking.onclick = () => {
      socket.emit('get_ranking');
    };
  }

  socket.on('ranking_data', (rankingList) => {
    const container = document.getElementById('ranking-list');
    if (!container) return;
    
    container.innerHTML = '';
    if (rankingList.length === 0) {
      container.innerHTML = '<div style="text-align:center;">記録がありません</div>';
    } else {
      rankingList.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'rank-row';
        div.innerHTML = `
          <span><strong>#${index + 1}</strong> ${escapeHtml(item.name)} (Lv.${item.level})</span>
          <span>${item.wins} 勝</span>
        `;
        container.appendChild(div);
      });
    }
    document.getElementById('ranking-modal').style.display = 'flex';
  });

  socket.on('match_found', (data) => {
    currentRoomId = data.roomId;
    const themeElem = document.getElementById('theme-display');
    const timelineElem = document.getElementById('chat-timeline');

    if (themeElem) themeElem.innerText = `お題: ${data.theme}`;
    if (timelineElem) timelineElem.innerHTML = '';
    showScreen('battle-screen');
  });

  socket.on('tick_status', (data) => {
    const timerElem = document.getElementById('timer-display');
    if (timerElem) {
      const m = Math.floor(data.timeLeft / 60).toString().padStart(2, '0');
      const s = (data.timeLeft % 60).toString().padStart(2, '0');
      timerElem.innerText = `残り時間 ${m}:${s}`;
    }

    const pIds = Object.keys(data.players);
    if (pIds.length === 2) {
      const myData = data.players[socket.id];
      const oppId = pIds.find(id => id !== socket.id);
      const oppData = data.players[oppId];

      if (myData && oppData) {
        const p1Name = document.getElementById('p1-name');
        const p1HpText = document.getElementById('p1-hp-text');
        const p1HpBar = document.getElementById('p1-hp-bar');
        const p2Name = document.getElementById('p2-name');
        const p2HpText = document.getElementById('p2-hp-text');
        const p2HpBar = document.getElementById('p2-hp-bar');
        const typingElem = document.getElementById('typing-indicator');

        if (p1Name) p1Name.innerText = `${myData.name} (あなた)`;
        if (p1HpText) p1HpText.innerText = myData.hp;
        if (p1HpBar) p1HpBar.style.width = `${(myData.hp / 10000) * 100}%`;

        if (p2Name) p2Name.innerText = oppData.name;
        if (p2HpText) p2HpText.innerText = oppData.hp;
        if (p2HpBar) p2HpBar.style.width = `${(oppData.hp / 10000) * 100}%`;

        if (typingElem) {
          typingElem.innerText = oppData.isTyping ? `${oppData.name} が入力中...` : '';
        }
      }
    }
  });

  const chatInput = document.getElementById('chat-input');
  const btnSend = document.getElementById('btn-send');

  function sendMessage() {
    if (!chatInput) return;
    const msg = chatInput.value.trim();
    if (!msg || !currentRoomId) return;
    socket.emit('send_message', { roomId: currentRoomId, message: msg });
    chatInput.value = '';
    sendTypingStatus(false);
  }

  if (btnSend) btnSend.onclick = sendMessage;
  if (chatInput) {
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    chatInput.oninput = () => {
      sendTypingStatus(true);
      clearTimeout(isTypingTimer);
      isTypingTimer = setTimeout(() => sendTypingStatus(false), 1500);
    };
  }

  function sendTypingStatus(isTyping) {
    if (currentRoomId) socket.emit('typing_status', { roomId: currentRoomId, isTyping });
  }

  socket.on('receive_message', (data) => {
    const timeline = document.getElementById('chat-timeline');
    if (!timeline) return;

    const isSelf = data.senderId === socket.id;
    const bubbleDiv = document.createElement('div');
    bubbleDiv.className = `chat-bubble ${isSelf ? 'bubble-mine' : 'bubble-other'}`;
    bubbleDiv.innerHTML = `<div class="sender-name">${escapeHtml(data.senderName)} (${data.senderSide})</div><div>${escapeHtml(data.message)}</div>`;

    timeline.appendChild(bubbleDiv);
    timeline.scrollTop = timeline.scrollHeight;
  });

  const btnSurrender = document.getElementById('btn-surrender');
  if (btnSurrender) {
    btnSurrender.onclick = () => {
      if (currentRoomId && confirm("本当に降参しますか？")) {
        socket.emit('surrender', { roomId: currentRoomId });
      }
    };
  }

  socket.on('game_over', (data) => {
    showScreen('menu-screen');
    let title = "試合終了";
    let message = "";

    if (data.reason === "OPPONENT_KICKED") {
      title = "🎉 不戦勝！";
      message = "相手プレイヤーが暴言（NGワード）によりキックされたため、あなたの勝利です！";
    } else if (data.reason === "DISCONNECTED") {
      title = "🎉 不戦勝！";
      message = "相手プレイヤーが通信切断（タブを閉じた等）したため、あなたの勝利です！";
    } else if (data.reason === "SURRENDER") {
      title = "試合決着";
      message = `勝者: ${data.winnerName}\n（降参により決着）`;
    } else {
      title = data.winnerName === "DRAW" ? "引き分け！" : `🎉 勝者: ${data.winnerName}`;
      message = data.reason === "HP_ZERO" ? "HPが0になりました！" : "制限時間が終了しました！";
    }

    showNoticeModal(title, message);
    socket.emit('auth_user', { userId: userId });
  });

  socket.on('kicked_notification', (data) => {
    showScreen('menu-screen');
    showNoticeModal("ペナルティ通知", data.reason);
  });

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
