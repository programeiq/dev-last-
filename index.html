<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆるろん</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }
    #battle-screen {
      display: none;
    }
  </style>
</head>
<body>

  <!-- BGM用オーディオ -->
  <audio id="bgm" src="bgm.mp3" loop></audio>

  <!-- マッチング待機画面 -->
  <div id="lobby-screen" class="card">
    <h1>ゆるろん</h1>
    <p>名前を入力して対戦相手を探そう！</p>
    <input type="text" id="username" placeholder="プレイヤー名" value="プレイヤー1"><br>
    <button id="start-btn" onclick="startMatching()">対戦相手を探す</button>
    <button id="bgm-btn" onclick="toggleBGM()">BGM: ON</button>
    <p id="status-text" style="color: #666;"></p>
  </div>

  <!-- 対戦画面 -->
  <div id="battle-screen" class="card">
    <h2>ゆるろん開始！</h2>
    <p id="room-info"></p>
    <p id="theme-info" style="font-size: 18px; font-weight: bold;"></p>
    <p id="side-info" style="color: #d9534f; font-weight: bold;"></p>
  </div>

  <script>
    const myUserId = `user_${Math.random().toString(36).substring(2, 9)}`;
    const bgm = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgm-btn');
    bgm.volume = 0.3;

    function playBGM() {
      if (bgm.paused) {
        bgm.play().catch(err => console.log("BGM再生待機中:", err));
      }
    }
    document.body.addEventListener('click', playBGM, { once: true });

    function toggleBGM() {
      if (bgm.paused) {
        bgm.play();
        bgmBtn.innerText = "BGM: ON";
      } else {
        bgm.pause();
        bgmBtn.innerText = "BGM: OFF";
      }
    }

    async function startMatching() {
      playBGM();
      
      const username = document.getElementById('username').value.trim() || '名無し';
      const statusText = document.getElementById('status-text');
      const startBtn = document.getElementById('start-btn');

      startBtn.disabled = true;
      statusText.innerText = "対戦相手を探しています...";

      try {
        const response = await fetch(`/match?username=${encodeURIComponent(username)}&userId=${myUserId}`);
        const data = await response.json();

        if (data.status === 'SUCCESS') {
          document.getElementById('lobby-screen').style.display = 'none';
          document.getElementById('battle-screen').style.display = 'block';

          document.getElementById('room-info').innerText = `部屋名: ${data.room} (VS ${data.opponent})`;
          document.getElementById('theme-info').innerText = `お題: ${data.theme}`;
          document.getElementById('side-info').innerText = `あなたの立論: 【${data.yourSide}】`;
        }
      } catch (error) {
        console.error('Matching Error:', error);
        statusText.innerText = "通信エラーが発生しました。再試行してください。";
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
