<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゆるろん</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  background-color: #fce4ec;
  color: #4a4a4a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

#app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  max-height: 840px;
  background-color: #ffffff;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 8px 24px rgba(240, 98, 146, 0.2);
  border-radius: 20px;
  overflow: hidden;
  border: 4px solid #f8bbd0;
}

/* 画面切り替え */
.screen {
  display: none;
  flex-direction: column;
  height: 100%;
  padding: 20px;
}

.screen.active {
  display: flex !important;
}

/* メニュー画面 */
#menu-screen {
  position: relative;
  width: 100%;
  align-items: center;
}

.app-title {
  font-size: 2.5rem;
  color: #ff4081;
  font-weight: bold;
  margin-top: 20px;
  margin-bottom: 20px;
  text-shadow: 2px 2px 0px #f8bbd0;
}

.profile-box {
  width: 100%;
  background: #fff0f5;
  border: 3px dashed #ff80ab;
  border-radius: 16px;
  padding: 15px;
  text-align: center;
  margin-bottom: 20px;
}

.avatar-area {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 10px;
  cursor: pointer;
}

.avatar-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background-color: #ffcdd2;
  object-fit: cover;
  border: 3px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.player-name-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.player-name {
  font-size: 1.2rem;
  font-weight: bold;
  color: #c2185b;
}

.btn-edit-name {
  background: #ff80ab;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 2px 8px;
  font-size: 0.75rem;
  cursor: pointer;
}

.user-stats {
  display: flex;
  justify-content: space-around;
  font-weight: bold;
  color: #880e4f;
  background: rgba(255, 255, 255, 0.6);
  padding: 6px;
  border-radius: 10px;
}

.menu-btn-group {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: auto;
  margin-bottom: 20px;
}

.btn-yuru {
  padding: 14px;
  border: none;
  border-radius: 25px;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0px rgba(0,0,0,0.1);
  transition: transform 0.1s;
}

.btn-yuru:active {
  transform: translateY(2px);
  box-shadow: none;
}

.btn-pink { background: #ff4081; color: white; }
.btn-light-pink { background: #ff80ab; color: white; }
.btn-purple { background: #ba68c8; color: white; }
.btn-gray { background: #e0e0e0; color: #616161; }

/* マッチング画面 */
.matching-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  color: #ff4081;
}

.yuru-loader {
  width: 50px;
  height: 50px;
  border: 5px solid #f8bbd0;
  border-top: 5px solid #ff4081;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* バトル画面 */
.battle-header {
  background: #fff0f5;
  padding: 10px;
  border-radius: 12px;
  border: 2px solid #ff80ab;
  margin-bottom: 10px;
}

.timer-display {
  text-align: center;
  font-size: 1.1rem;
  font-weight: bold;
  color: #ff4081;
}

.theme-box {
  text-align: center;
  font-size: 0.95rem;
  font-weight: bold;
  color: #880e4f;
  margin-top: 4px;
}

.hp-status-container {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.hp-card {
  flex: 1;
  background: #fff3e0;
  border: 2px solid #ffe0b2;
  padding: 8px;
  border-radius: 10px;
}

.hp-bar-bg {
  width: 100%;
  height: 12px;
  background: #ffe0b2;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 4px;
}

.hp-bar-fill {
  height: 100%;
  background: #ff9800;
  width: 100%;
  transition: width 0.3s;
}

.chat-timeline {
  flex: 1;
  background: #fafafa;
  border: 2px solid #f0f0f0;
  border-radius: 12px;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}

.msg-bubble {
  max-width: 80%;
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 0.9rem;
  word-break: break-all;
}

.msg-self {
  align-self: flex-end;
  background-color: #ff80ab;
  color: white;
  border-bottom-right-radius: 4px;
}

.msg-opponent {
  align-self: flex-start;
  background-color: #ffffff;
  color: #4a4a4a;
  border: 2px solid #f8bbd0;
  border-bottom-left-radius: 4px;
}

.msg-sender {
  font-size: 0.7rem;
  opacity: 0.8;
  margin-bottom: 2px;
}

.typing-indicator {
  font-size: 0.8rem;
  color: #ba68c8;
  height: 16px;
  margin-bottom: 4px;
}

.input-area {
  display: flex;
  gap: 6px;
}

.input-area input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 2px solid #ff80ab;
  outline: none;
}

/* モーダル */
.modal-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.4);
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 85%;
  border: 3px solid #ff80ab;
  text-align: center;
}

.modal-title {
  font-size: 1.2rem;
  font-weight: bold;
  color: #ff4081;
  margin-bottom: 12px;
}

.ranking-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 15px;
}

.ranking-table th, .ranking-table td {
  padding: 8px;
  border-bottom: 1px solid #f8bbd0;
  font-size: 0.85rem;
}

.ranking-table th {
  background-color: #fff0f5;
  color: #c2185b;
}
</style>
</head>
<body>

<div id="app">
  <!-- 1. メニュー画面 -->
  <div id="menu-screen" class="screen active">
    <div class="app-title">ゆるろん</div>

    <div class="profile-box">
      <div class="avatar-area" onclick="triggerImageUpload()">
        <img id="avatar-img" class="avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='40' fill='%23ffcdd2'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='30' fill='%23c2185b'>🌸</text></svg>" alt="icon">
        <input type="file" id="icon-file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
      </div>

      <div class="player-name-container">
        <span id="player-name-disp" class="player-name">名無し</span>
        <button class="btn-edit-name" onclick="changeName()">名前変更</button>
      </div>

      <div class="user-stats">
        <span id="user-display-level">Lv.1</span>
        <span id="user-display-wins">0 勝</span>
      </div>
    </div>

    <div class="menu-btn-group">
      <button class="btn-yuru btn-pink" onclick="startMatching()">オンライン対戦</button>
      <button class="btn-yuru btn-light-pink" onclick="openRankingModal()">ランキング</button>
    </div>
  </div>

  <!-- 2. マッチング画面 -->
  <div id="matching-screen" class="screen">
    <div class="matching-box">
      <div class="yuru-loader"></div>
      <p>対戦相手を探してるだみョン...</p>
    </div>
  </div>

  <!-- 3. バトル画面 -->
  <div id="battle-screen" class="screen">
    <div class="battle-header">
      <div id="timer-display" class="timer-display">残り時間 03:00</div>
      <div id="theme-display" class="theme-box">お題を取得中...</div>
    </div>

    <div class="hp-status-container">
      <div class="hp-card">
        <div id="p1-name" style="font-size: 0.8rem; font-weight: bold;" class="player-name-p1">あなた</div>
        <div style="font-size: 0.75rem;">HP: <span id="p1-hp-text">10000</span></div>
        <div class="hp-bar-bg"><div id="p1-hp-bar" class="hp-bar-fill"></div></div>
      </div>
      <div class="hp-card">
        <div id="p2-name" style="font-size: 0.8rem; font-weight: bold;">相手</div>
        <div style="font-size: 0.75rem;">HP: <span id="p2-hp-text">10000</span></div>
        <div class="hp-bar-bg"><div id="p2-hp-bar" class="hp-bar-fill"></div></div>
      </div>
    </div>

    <div id="chat-timeline" class="chat-timeline"></div>
    <div id="typing-indicator" class="typing-indicator"></div>

    <div class="input-area">
      <input type="text" id="chat-input" placeholder="メッセージを入力..." maxlength="100">
      <button class="btn-yuru btn-pink" style="padding: 8px 15px; font-size: 0.9rem;" onclick="sendMessage()">送信</button>
      <button class="btn-yuru btn-gray" style="padding: 8px 12px; font-size: 0.8rem;" onclick="surrender()">降参</button>
    </div>
  </div>

  <!-- お知らせモーダル -->
  <div id="notice-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="modal-title" class="modal-title">お知らせ</div>
      <div id="modal-body" style="margin-bottom: 15px; white-space: pre-wrap; font-size: 0.9rem;"></div>
      <button class="btn-yuru btn-pink" style="width: 100%; padding: 10px;" onclick="closeNoticeModal()">閉じる</button>
    </div>
  </div>

  <!-- ランキングモーダル -->
  <div id="ranking-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">🏆 勝利数ランキング</div>
      <div id="ranking-modal-body" style="max-height: 220px; overflow-y: auto;">
        最新データを読み込み中...
      </div>
      <button class="btn-yuru btn-light-pink" style="width: 100%; padding: 10px; margin-top: 10px;" onclick="closeRankingModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
  function getOrCreateUserId() {
    let userId = localStorage.getItem('yururon_user_id') || 
                 localStorage.getItem('user_id') || 
                 localStorage.getItem('userId');
    
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
    }
    
    localStorage.setItem('yururon_user_id', userId);
    return userId;
  }

  const userId = getOrCreateUserId();
  const socket = io();

  let userName = "名無し";
  let currentRoomId = null;
  let isTypingTimer = null;

  socket.on('connect', () => {
    socket.emit('auth_user', { userId: userId });
  });

  socket.on('user_data_loaded', (userData) => {
    if (userData.name) {
      userName = userData.name;
      document.getElementById('player-name-disp').innerText = userName;
    }
    document.getElementById('user-display-level').innerText = `Lv.${userData.level}`;
    document.getElementById('user-display-wins').innerText = `${userData.wins} 勝`;
  });

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function changeName() {
    const input = prompt("新しいプレイヤー名を入力してください（10文字以内）:", userName);
    if (input && input.trim() !== "") {
      userName = input.trim().substring(0, 10);
      document.getElementById('player-name-disp').innerText = userName;
      socket.emit('update_name', { name: userName });
    }
  }

  function triggerImageUpload() {
    document.getElementById('icon-file-input').click();
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('avatar-img').src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function startMatching() {
    showScreen('matching-screen');
    socket.emit('join_match', { name: userName });
  }

  function openRankingModal() {
    const body = document.getElementById('ranking-modal-body');
    body.innerText = "最新データを読み込み中...";
    document.getElementById('ranking-modal').style.display = 'flex';

    socket.emit('get_ranking');
  }

  function closeRankingModal() {
    document.getElementById('ranking-modal').style.display = 'none';
  }

  socket.on('ranking_data', (rankingList) => {
    const body = document.getElementById('ranking-modal-body');

    if (!rankingList || rankingList.length === 0) {
      body.innerHTML = "<p style='text-align:center;'>まだ勝利記録がありません。<br>勝利して1位を目指そう！</p>";
      return;
    }

    let html = `
      <table class="ranking-table">
        <thead>
          <tr>
            <th>順位</th>
            <th>プレイヤー名</th>
            <th>勝利数</th>
          </tr>
        </thead>
        <tbody>
    `;

    rankingList.forEach((item, index) => {
      html += `
        <tr>
          <td><strong>#${index + 1}</strong></td>
          <td>${escapeHtml(item.name)} (Lv.${item.level})</td>
          <td>${item.wins} 勝</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    body.innerHTML = html;
  });

  socket.on('match_found', (data) => {
    currentRoomId = data.roomId;
    document.getElementById('theme-display').innerText = `お題: ${data.theme}`;
    document.getElementById('chat-timeline').innerHTML = '';
    showScreen('battle-screen');
  });

  socket.on('tick_status', (data) => {
    const timerElem = document.getElementById('timer-display');
    const m = Math.floor(data.timeLeft / 60).toString().padStart(2, '0');
    const s = (data.timeLeft % 60).toString().padStart(2, '0');
    timerElem.innerText = `残り時間 ${m}:${s}`;

    const pIds = Object.keys(data.players);
    if (pIds.length === 2) {
      const myData = data.players[socket.id];
      const oppId = pIds.find(id => id !== socket.id);
      const oppData = data.players[oppId];

      if (myData && oppData) {
        document.getElementById('p1-name').innerText = `${myData.name} (あなた)`;
        document.getElementById('p1-hp-text').innerText = myData.hp;
        document.getElementById('p1-hp-bar').style.width = `${(myData.hp / 10000) * 100}%`;

        document.getElementById('p2-name').innerText = oppData.name;
        document.getElementById('p2-hp-text').innerText = oppData.hp;
        document.getElementById('p2-hp-bar').style.width = `${(oppData.hp / 10000) * 100}%`;

        const typingElem = document.getElementById('typing-indicator');
        typingElem.innerText = oppData.isTyping ? `${oppData.name} が入力中...` : '';
      }
    }
  });

  const chatInput = document.getElementById('chat-input');
  
  function sendMessage() {
    const msg = chatInput.value.trim();
    if (!msg || !currentRoomId) return;
    socket.emit('send_message', { roomId: currentRoomId, message: msg });
    chatInput.value = '';
    sendTypingStatus(false);
  }

  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  chatInput.addEventListener('input', () => {
    sendTypingStatus(true);
    clearTimeout(isTypingTimer);
    isTypingTimer = setTimeout(() => sendTypingStatus(false), 1500);
  });

  function sendTypingStatus(isTyping) {
    if (currentRoomId) socket.emit('typing_status', { roomId: currentRoomId, isTyping });
  }

  socket.on('receive_message', (data) => {
    const timeline = document.getElementById('chat-timeline');
    const isSelf = data.senderId === socket.id;

    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${isSelf ? 'msg-self' : 'msg-opponent'}`;
    bubble.innerHTML = `<div class="msg-sender">${escapeHtml(data.senderName)} (${data.senderSide})</div><div>${escapeHtml(data.message)}</div>`;

    timeline.appendChild(bubble);
    timeline.scrollTop = timeline.scrollHeight;
  });

  function surrender() {
    if (currentRoomId && confirm("本当に降参しますか？")) {
      socket.emit('surrender', { roomId: currentRoomId });
    }
  }

  socket.on('game_over', (data) => {
    showScreen('menu-screen');
    let title = "試合終了だみョン！";
    let message = "";

    if (data.reason === "OPPONENT_KICKED") {
      title = "🎉 不戦勝！";
      message = "相手プレイヤーが暴言（NGワード）によりキックされたため、あなたの勝利です！";
    } else if (data.reason === "DISCONNECTED") {
      title = "🎉 不戦勝！";
      message = "相手プレイヤーが通信切断（タブを閉じた等）したため、あなたの勝利です！";
    } else if (data.reason === "SURRENDER") {
      title = "試合決着";
      message = `勝者: ${data.winnerName}\n（降参により決着）`;
    } else {
      title = data.winnerName === "DRAW" ? "引き分け！" : `🎉 勝者: ${data.winnerName}`;
      message = data.reason === "HP_ZERO" ? "HPが0になりました！" : "制限時間が終了しました！";
    }

    showNoticeModal(title, message);
    socket.emit('auth_user', { userId: userId });
  });

  socket.on('kicked_notification', (data) => {
    showScreen('menu-screen');
    showNoticeModal("ペナルティ通知", data.reason);
  });

  function showNoticeModal(title, text) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-body').innerText = text;
    document.getElementById('notice-modal').style.display = 'flex';
  }

  function closeNoticeModal() {
    document.getElementById('notice-modal').style.display = 'none';
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
